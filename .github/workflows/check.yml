name: Standalone desktop quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm format:check
      - run: pnpm standards
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:ui
      - run: ./scripts/verify-retained-source.ps1
      - run: ./scripts/prepare-engine.ps1
      - run: ./scripts/test-runtime-staging.ps1
      - run: ./scripts/prepare-runtimes.ps1
      - run: ./scripts/prepare-validation.ps1
      - run: ./scripts/prepare-validation-host.ps1
      - run: ./scripts/test-optimizer-host.ps1
      - run: ./scripts/prepare-optimizer.ps1
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm tauri build --debug --no-bundle
      - run: pnpm test:desktop
      - run: pnpm test:workspace:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-quality-evidence
          path: |
            artifacts/native/**/report.json
            artifacts/native/**/*.png
            artifacts/workspace-native/**/report.json
            artifacts/workspace-native/**/*.png
            artifacts/optimizer-host-tests/**/result.json
            playwright-report/
            test-results/
          retention-days: 7
