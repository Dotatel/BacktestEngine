[package]
name = "dotatel-backtest-engine"
version = "0.1.0"
description = "DotaTel standalone desktop application"
edition = "2021"
rust-version = "1.85"

[lib]
name = "dotatel_backtest_engine"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-dialog = "2"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
semver = "1.0.28"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
